<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Experience</title>
<style>
:root{--ink:#25233a;--pink:#ff6f9f;--yellow:#ffd94d;--purple:#8b6de9;--line:#eee8f2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff}
.screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:28px 16px;text-align:center;background:#fff}
.screen.active{display:flex}
.panel{width:min(920px,100%);padding:clamp(22px,5vw,48px);border:1px solid var(--line);border-radius:30px;background:#fff;box-shadow:0 18px 60px #33204412}
h1{font-size:clamp(2.5rem,7vw,5rem);line-height:1.04;margin:0 0 12px;color:#292438}
h2{font-size:clamp(1.8rem,5vw,3rem);margin:0 0 10px;color:#292438}
p{color:#655d70;font-size:1.05rem}
button{border:0;border-radius:999px;padding:14px 32px;font-size:1.05rem;font-weight:800;color:#382a21;background:var(--yellow);cursor:pointer;box-shadow:0 7px 18px #e5bf4c35;transition:transform .2s}
button:hover{transform:translateY(-3px)}
.dance-row{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,38px);margin:20px auto 28px;flex-wrap:wrap}
.pika-wrap{position:relative;width:min(290px,75vw);margin:12px auto 22px;animation:bob 1s ease-in-out infinite alternate}
.pika-wrap svg{width:100%;height:auto;overflow:visible}
.speech{display:inline-block;padding:10px 20px;background:#fff5c9;border:2px solid #f0d76e;border-radius:20px;font-weight:900;font-size:1.5rem;color:#5c4810;animation:pop .8s infinite alternate}
.character-card{min-height:205px;border:2px solid #f0ebf3;border-radius:24px;background:#fff;padding:12px 10px;color:var(--ink);box-shadow:0 8px 22px #3120440a}
.character-card:hover{border-color:#ffc5d8;background:#fffafd}
.character-card svg{display:block;width:100%;height:135px;margin:0 auto 4px}
.character-card strong{font-size:1.08rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;max-width:650px;margin:25px auto}
.result-symbol{font-size:clamp(7rem,23vw,12rem);display:block;animation:pop .6s cubic-bezier(.2,1.5,.5,1) both}
.result-line{font-size:clamp(1.15rem,4vw,1.8rem);font-weight:900;color:#d43c71}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}
.secondary{background:#fff;border:2px solid #e9e1ed;box-shadow:none;color:#4d4356}
@keyframes bob{from{transform:translateY(7px) rotate(-3deg)}to{transform:translateY(-8px) rotate(3deg)}}
@keyframes pop{from{transform:scale(.5) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
.wave-arm{transform-origin:170px 160px;animation:wave .55s ease-in-out infinite}
.dancer{animation:bob .8s ease-in-out infinite alternate}
.dancer:nth-child(2){animation-delay:.15s}.dancer:nth-child(3){animation-delay:.3s}.dancer:nth-child(4){animation-delay:.45s}
@media(max-width:480px){.grid{gap:10px}.character-card{min-height:180px}.character-card svg{height:115px}.panel{padding:25px 15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="screen active" id="home">
 <main class="panel">
  <h1>Best Experience ✨</h1>
  <p>Come on in — Pikachu has a special hello for you!</p>
  <div class="pika-wrap" aria-label="Animated Pikachu waving hello">
   <svg viewBox="0 0 260 250" role="img" aria-label="Cute yellow electric mouse cartoon waving">
    <path d="M75 65 L45 5 Q42 -3 54 4 L112 45Z" fill="#ffd83f" stroke="#b98a20" stroke-width="4"/>
    <path d="M45 5 L54 4 L76 43 L64 47Z" fill="#29232b"/>
    <path d="M174 49 L218 3 Q228 -5 226 10 L207 76Z" fill="#ffd83f" stroke="#b98a20" stroke-width="4"/>
    <path d="M218 3 Q229 -3 226 10 L218 29 L204 19Z" fill="#29232b"/>
    <ellipse cx="130" cy="142" rx="83" ry="83" fill="#ffdc45" stroke="#b98a20" stroke-width="4"/>
    <ellipse cx="97" cy="130" rx="8" ry="12" fill="#29232b"/><ellipse cx="163" cy="130" rx="8" ry="12" fill="#29232b"/>
    <circle cx="76" cy="158" r="17" fill="#f05b58"/><circle cx="184" cy="158" r="17" fill="#f05b58"/>
    <path d="M119 155 Q130 167 141 155" fill="none" stroke="#6c3b25" stroke-width="5" stroke-linecap="round"/>
    <path d="M117 176 Q130 188 143 176" fill="#e96b69" stroke="#6c3b25" stroke-width="3"/>
    <path d="M64 190 Q40 211 59 226 Q81 233 91 207" fill="#ffdc45" stroke="#b98a20" stroke-width="4"/>
    <path d="M183 191 Q211 177 217 157" fill="none" stroke="#b98a20" stroke-width="10" stroke-linecap="round"/>
    <g class="wave-arm"><path d="M184 170 Q213 140 203 111" fill="none" stroke="#ffd83f" stroke-width="22" stroke-linecap="round"/><path d="M203 116 Q190 98 202 88 M203 116 Q218 98 224 105" fill="none" stroke="#b98a20" stroke-width="7" stroke-linecap="round"/></g>
    <path d="M180 202 L212 186 L234 202 L214 216 L227 238 L195 224Z" fill="#ffd83f" stroke="#b98a20" stroke-width="4"/>
    <path d="M90 218 Q130 235 169 218" fill="none" stroke="#b98a20" stroke-width="4"/>
   </svg>
  </div>
  <div class="speech">Hiiii! 👋⚡</div>
  <p><button class="secondary" onclick="playUploadedAudio()">🔊 Play Pikachu audio</button></p>
  <p style="font-size:.82rem;color:#8b8491">If automatic sound is blocked, tap “Play Pikachu audio” once.</p>
  <button onclick="document.getElementById('home').classList.remove('active'); document.getElementById('choose').classList.add('active')">START ▶</button>
 </main>
</section>

<section class="screen" id="choose">
 <main class="panel">
  <h2>Choose your cartoon! 🎨</h2>
  <p>Pick one of your favourite characters.</p>
  <div class="grid">
   <button class="character-card" onclick="reveal('Oggy','😼')">
    <svg viewBox="0 0 180 135" role="img" aria-label="Blue cartoon cat">
     <path d="M42 48 L35 8 L73 30 Q91 20 110 30 L145 8 L140 54" fill="#278fdb" stroke="#164e80" stroke-width="5" stroke-linejoin="round"/>
     <ellipse cx="90" cy="78" rx="58" ry="49" fill="#329fe8" stroke="#164e80" stroke-width="5"/>
     <ellipse cx="72" cy="67" rx="9" ry="13" fill="white"/><ellipse cx="108" cy="67" rx="9" ry="13" fill="white"/>
     <circle cx="74" cy="68" r="4" fill="#25233a"/><circle cx="106" cy="68" r="4" fill="#25233a"/>
     <ellipse cx="90" cy="88" rx="18" ry="12" fill="#fff"/><path d="M83 84 Q90 91 97 84" fill="none" stroke="#333" stroke-width="3"/>
     <path d="M52 105 Q90 120 128 105" fill="none" stroke="#164e80" stroke-width="4"/>
    </svg><strong>Oggy</strong>
   </button>
   <button class="character-card" onclick="reveal('Tom & Jerry','😂')">
    <svg viewBox="0 0 180 135" role="img" aria-label="Grey cat and little brown mouse cartoon">
     <path d="M18 50 L22 5 L57 31 Q77 24 91 39 L100 5 L123 50" fill="#9ca3af" stroke="#4b5563" stroke-width="4"/>
     <ellipse cx="66" cy="76" rx="47" ry="42" fill="#aeb4bd" stroke="#4b5563" stroke-width="4"/>
     <ellipse cx="50" cy="67" rx="7" ry="10" fill="white"/><ellipse cx="82" cy="67" rx="7" ry="10" fill="white"/>
     <circle cx="52" cy="68" r="3" fill="#222"/><circle cx="80" cy="68" r="3" fill="#222"/>
     <ellipse cx="66" cy="85" rx="13" ry="9" fill="#f7c6c9"/><path d="M59 94 Q66 100 73 94" fill="none" stroke="#333" stroke-width="3"/>
     <circle cx="139" cy="93" r="23" fill="#b97843" stroke="#704321" stroke-width="4"/>
     <circle cx="124" cy="74" r="12" fill="#d99a62" stroke="#704321" stroke-width="3"/><circle cx="153" cy="74" r="12" fill="#d99a62" stroke="#704321" stroke-width="3"/>
     <circle cx="133" cy="90" r="3" fill="#222"/><circle cx="145" cy="90" r="3" fill="#222"/><ellipse cx="139" cy="99" rx="6" ry="4" fill="#f4c5a2"/>
    </svg><strong>Tom &amp; Jerry</strong>
   </button>
   <button class="character-card" onclick="reveal('Mr. Bean','🤪')">
    <svg viewBox="0 0 180 135" role="img" aria-label="Funny cartoon man in brown jacket">
     <path d="M47 132 Q48 91 90 89 Q132 91 134 132Z" fill="#8b684c" stroke="#4e392b" stroke-width="4"/>
     <path d="M73 91 L90 117 L107 91 L99 84 L81 84Z" fill="white"/>
     <path d="M79 91 L90 112 L101 91 L90 97Z" fill="#d94b4b"/>
     <ellipse cx="90" cy="53" rx="39" ry="45" fill="#f1c49d" stroke="#805b43" stroke-width="4"/>
     <path d="M52 42 Q52 4 91 8 Q130 7 128 43 Q112 26 91 29 Q68 26 52 42" fill="#4a382d"/>
     <ellipse cx="76" cy="53" rx="5" ry="8" fill="white"/><ellipse cx="104" cy="53" rx="5" ry="8" fill="white"/>
     <circle cx="77" cy="54" r="3" fill="#222"/><circle cx="103" cy="54" r="3" fill="#222"/>
     <path d="M77 73 Q90 84 104 72" fill="none" stroke="#633c31" stroke-width="4" stroke-linecap="round"/>
    </svg><strong>Mr. Bean</strong>
   </button>
   <button class="character-card" onclick="reveal('Dora','🥳')">
    <svg viewBox="0 0 180 135" role="img" aria-label="Cartoon girl explorer with backpack">
     <path d="M45 47 Q39 8 90 7 Q141 8 135 52 L126 103 L54 103Z" fill="#4b2c20"/>
     <ellipse cx="90" cy="58" rx="39" ry="43" fill="#c98758" stroke="#805039" stroke-width="4"/>
     <path d="M51 49 Q50 5 90 8 Q130 5 129 48 Q111 28 90 30 Q69 28 51 49" fill="#4b2c20"/>
     <ellipse cx="76" cy="57" rx="5" ry="7" fill="white"/><ellipse cx="104" cy="57" rx="5" ry="7" fill="white"/>
     <circle cx="77" cy="58" r="3" fill="#222"/><circle cx="103" cy="58" r="3" fill="#222"/>
     <path d="M77 76 Q90 88 103 76" fill="none" stroke="#713e35" stroke-width="4" stroke-linecap="round"/>
     <path d="M48 132 Q51 98 90 98 Q129 98 132 132Z" fill="#e879a6" stroke="#a53f72" stroke-width="4"/>
     <path d="M38 103 Q19 105 25 132 L50 132 L55 108Z" fill="#f2c64c" stroke="#a47b25" stroke-width="3"/>
    </svg><strong>Dora</strong>
   </button>
  </div>
 </main>
</section>

<section class="screen" id="result">
 <main class="panel">
  <h2 id="resultTitle">Surprise!</h2>
  <span class="result-symbol" id="symbol">🖕</span>
  <p class="result-line">2 rupees pampaka pothe nuvu kojja</p>
  <div class="actions">
   <button onclick="showScreen('choose')">Choose again</button>
   <button class="secondary" onclick="showScreen('home')">Home</button>
  </div>
 </main>
</section>
 <audio id="pikaAudio" loop>
  <source src="pika-pika%20(1).mp3" type="audio/mpeg">
</audio>
<script>
function showScreen(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function reveal(name,emoji){
 document.getElementById('resultTitle').textContent='You picked '+name+' '+emoji;
 showScreen('result');
}
function playUploadedAudio() {
    const audio = document.getElementById('pikaAudio');
    audio.currentTime = 0;
    audio.play().catch(error => console.log(error));
}

document.addEventListener('click', function() {
    playUploadedAudio();
}, { once: true });
</script>
</body>
</html>
