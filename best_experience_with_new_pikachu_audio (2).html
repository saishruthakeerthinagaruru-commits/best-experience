<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Experience</title>
<style>
:root{--ink:#25233a;--pink:#ff6f9f;--yellow:#ffd94d;--purple:#8b6de9;--line:#eee8f2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff}
.screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:28px 16px;text-align:center;background:#fff}
.screen.active{display:flex}
.panel{width:min(920px,100%);padding:clamp(22px,5vw,48px);border:1px solid var(--line);border-radius:30px;background:#fff;box-shadow:0 18px 60px #33204412}
h1{font-size:clamp(2.5rem,7vw,5rem);line-height:1.04;margin:0 0 12px;color:#292438}
h2{font-size:clamp(1.8rem,5vw,3rem);margin:0 0 10px;color:#292438}
p{color:#655d70;font-size:1.05rem}
button{border:0;border-radius:999px;padding:14px 32px;font-size:1.05rem;font-weight:800;color:#382a21;background:var(--yellow);cursor:pointer;box-shadow:0 7px 18px #e5bf4c35;transition:transform .2s}
button:hover{transform:translateY(-3px)}
.dance-row{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,38px);margin:20px auto 28px;flex-wrap:wrap}
.pika-wrap{position:relative;width:min(290px,75vw);margin:12px auto 22px;animation:bob 1s ease-in-out infinite alternate}
.pika-wrap svg{width:100%;height:auto;overflow:visible}
.speech{display:inline-block;padding:10px 20px;background:#fff5c9;border:2px solid #f0d76e;border-radius:20px;font-weight:900;font-size:1.5rem;color:#5c4810;animation:pop .8s infinite alternate}
.character-card{min-height:205px;border:2px solid #f0ebf3;border-radius:24px;background:#fff;padding:12px 10px;color:var(--ink);box-shadow:0 8px 22px #3120440a}
.character-card:hover{border-color:#ffc5d8;background:#fffafd}
.character-card svg{display:block;width:100%;height:135px;margin:0 auto 4px}
.character-card strong{font-size:1.08rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;max-width:650px;margin:25px auto}
.result-symbol{font-size:clamp(7rem,23vw,12rem);display:block;animation:pop .6s cubic-bezier(.2,1.5,.5,1) both}
.result-line{font-size:clamp(1.15rem,4vw,1.8rem);font-weight:900;color:#d43c71}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}
.secondary{background:#fff;border:2px solid #e9e1ed;box-shadow:none;color:#4d4356}
@keyframes bob{from{transform:translateY(7px) rotate(-3deg)}to{transform:translateY(-8px) rotate(3deg)}}
@keyframes pop{from{transform:scale(.5) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
.wave-arm{transform-origin:170px 160px;animation:wave .55s ease-in-out infinite}
.dancer{animation:bob .8s ease-in-out infinite alternate}
.dancer:nth-child(2){animation-delay:.15s}.dancer:nth-child(3){animation-delay:.3s}.dancer:nth-child(4){animation-delay:.45s}
@media(max-width:480px){.grid{gap:10px}.character-card{min-height:180px}.character-card svg{height:115px}.panel{padding:25px 15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
function showScreen(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function reveal(name,emoji){
 document.getElementById('resultTitle').textContent='You picked '+name+' '+emoji;
 showScreen('result');
}
function playUploadedAudio(){
 const audio=document.getElementById('pikaAudio');
 audio.currentTime=0;
 audio.play().catch(()=>{});
}
window.addEventListener('load',()=>{
 const audio=document.getElementById('pikaAudio');
 audio.play().catch(()=>{});
});
</script>
